<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gift link maker</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 30%, #ffe3ee, #ffc2d6); font-family: "Segoe UI", system-ui, sans-serif; color: #4a2a38; padding: 20px; }
  .card { background: #fff; border-radius: 20px; padding: 24px; width: 100%; max-width: 460px; box-shadow: 0 10px 25px rgba(0,0,0,.15); }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  p { margin: 0 0 16px; opacity: .7; font-size: .95rem; }
  label { display: block; font-weight: 600; margin: 12px 0 6px; font-size: .9rem; }
  input { width: 100%; padding: 12px; border: 2px solid #ffc2d6; border-radius: 12px; font-size: 1rem; }
  input:focus { outline: none; border-color: #ff7aa2; }
  button { margin-top: 16px; width: 100%; padding: 12px; border: 0; border-radius: 12px; background: #ff7aa2; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
  button:active { transform: scale(.98); }
  #out { margin-top: 16px; padding: 12px; background: #fff0f5; border-radius: 12px; word-break: break-all; font-size: .9rem; display: none; }
  #msg { margin-top: 8px; color: #c0305f; font-size: .9rem; min-height: 1.2em; }
</style>
</head>
<body>
<div class="card">
  <h1>🎁 Gift link maker</h1>
  <p>Paste your letter link, get a link to send your friend.</p>

  <label for="letter">Letter link</label>
  <input id="letter" placeholder="https://letter-app-psi.vercel.app/m/2092f8faa7" autocomplete="off">

  <label for="name">Friend's name (optional)</label>
  <input id="name" placeholder="Sara" autocomplete="off">

  <button id="make">Make link</button>
  <div id="msg"></div>
  <div id="out"></div>
  <button id="copy" style="display:none">Copy link</button>
</div>

<script>
  const out = document.getElementById("out");
  const msg = document.getElementById("msg");
  const copyBtn = document.getElementById("copy");

  document.getElementById("make").addEventListener("click", () => {
    msg.textContent = ""; out.style.display = "none"; copyBtn.style.display = "none";

    // Take the code after /m/ (or accept the bare code)
    const raw = document.getElementById("letter").value.trim();
    const match = raw.match(/\/m\/([a-zA-Z0-9_-]+)/);
    const code = match ? match[1] : (/^[a-zA-Z0-9_-]+$/.test(raw) ? raw : "");
    if (!code) { msg.textContent = "Couldn't find the code. Paste the full letter link."; return; }

    // Gift page = index.html in the same folder as this page
    const base = location.href.split("?")[0].replace(/[^/]*$/, "");
    let link = base + "?m=" + code;
    const name = document.getElementById("name").value.trim();
    if (name) link += "&name=" + encodeURIComponent(name);

    out.textContent = link; out.style.display = "block"; copyBtn.style.display = "block";
  });

  copyBtn.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(out.textContent); msg.style.color = "#2e7d4f"; msg.textContent = "Copied! 💗"; }
    catch { msg.style.color = "#c0305f"; msg.textContent = "Copy failed, select the link and copy it manually."; }
  });
</script>
</body>
</html>
