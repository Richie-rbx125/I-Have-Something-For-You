<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I have something for you</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 50% 30%, #ffe3ee, #ffc2d6);
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; color: #4a2a38;
  }
  .scene { display: none; flex-direction: column; align-items: center; text-align: center; padding: 20px; animation: pop .5s ease; }
  .scene.active { display: flex; }
  @keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
  h1 { font-size: 2rem; margin: 16px 0 6px; text-shadow: 0 2px 0 #fff; }
  p.hint { margin: 0; opacity: .7; }
  .clickable { cursor: pointer; transition: transform .2s; }
  .clickable:hover { transform: scale(1.06); }
  .clickable:active { transform: scale(.95); }

  /* cat */
  #cat { width: min(70vw, 300px); animation: bob 2.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  #catPhoto { width: min(78vw, 340px); border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,.2); animation: bob 2.2s ease-in-out infinite; }
  .heart { display: inline-block; animation: beat 1s infinite; }
  @keyframes beat { 50% { transform: scale(1.3); } }

  /* hands */
  .hands { display: flex; gap: 28px; margin-top: 20px; }
  .hand { font-size: min(26vw, 140px); line-height: 1; background: none; border: 0; padding: 0; filter: drop-shadow(0 6px 6px rgba(0,0,0,.15)); }
  .hand.shake { animation: shake .5s; }
  @keyframes shake { 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }

  /* gift */
  .gift { font-size: min(40vw, 200px); background: none; border: 0; padding: 0; line-height: 1; animation: wiggle 1.4s infinite; filter: drop-shadow(0 8px 8px rgba(0,0,0,.2)); }
  @keyframes wiggle { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-8deg); } 40% { transform: rotate(8deg); } 60% { transform: rotate(-4deg); } 80% { transform: rotate(4deg); } }

  .confetti { position: fixed; top: -20px; font-size: 24px; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
</style>
</head>
<body>

<!-- Scene 1: cat -->
<div class="scene active" id="scene1">
  <img id="catPhoto" class="clickable" src="cat.jpg" alt="Cat holding a sunflower" style="display:none">
  <svg id="cat" class="clickable" viewBox="0 0 300 300" role="button" aria-label="Cat with something for you">
    <!-- ears -->
    <polygon points="55,110 70,25 130,70" fill="#fff" stroke="#e8d8de" stroke-width="3"/>
    <polygon points="245,110 230,25 170,70" fill="#fff" stroke="#e8d8de" stroke-width="3"/>
    <polygon points="72,95 78,50 110,72" fill="#ffc4d4"/>
    <polygon points="228,95 222,50 190,72" fill="#ffc4d4"/>
    <!-- head -->
    <ellipse cx="150" cy="160" rx="105" ry="95" fill="#fff" stroke="#e8d8de" stroke-width="3"/>
    <!-- eyes (happy squint) -->
    <path d="M95 150 Q112 135 130 150" stroke="#3b2a30" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M170 150 Q188 135 205 150" stroke="#3b2a30" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- cheeks -->
    <ellipse cx="90" cy="185" rx="16" ry="10" fill="#ffc4d4" opacity=".7"/>
    <ellipse cx="210" cy="185" rx="16" ry="10" fill="#ffc4d4" opacity=".7"/>
    <!-- nose -->
    <polygon points="141,175 159,175 150,187" fill="#ff9db5"/>
    <!-- whiskers -->
    <g stroke="#cbb8bf" stroke-width="3" stroke-linecap="round">
      <line x1="40" y1="170" x2="85" y2="178"/><line x1="40" y1="195" x2="85" y2="190"/>
      <line x1="260" y1="170" x2="215" y2="178"/><line x1="260" y1="195" x2="215" y2="190"/>
    </g>
    <!-- paw covering mouth (hiding the gift) -->
    <ellipse cx="150" cy="225" rx="42" ry="34" fill="#fff" stroke="#e8d8de" stroke-width="3"/>
    <g stroke="#e8d8de" stroke-width="3" stroke-linecap="round">
      <line x1="135" y1="205" x2="135" y2="220"/><line x1="150" y1="203" x2="150" y2="220"/><line x1="165" y1="205" x2="165" y2="220"/>
    </g>
  </svg>
  <h1>I have something for you <span class="heart">💗</span></h1>
  <p class="hint">tap the cat</p>
</div>

<!-- Scene 2: pick a hand -->
<div class="scene" id="scene2">
  <h1>Pick a hand 🤭</h1>
  <p class="hint">one of them is hiding something…</p>
  <div class="hands">
    <button class="hand clickable" data-hand="left" aria-label="Left hand">🤜</button>
    <button class="hand clickable" data-hand="right" aria-label="Right hand">🤛</button>
  </div>
</div>

<!-- Scene 3: gift -->
<div class="scene" id="scene3">
  <h1>Ta-da! 🎉</h1>
  <button class="gift clickable" id="giftBtn" aria-label="Open gift">🎁</button>
  <p class="hint">tap the gift to open it</p>
</div>

<script>
  // 👇 CHANGE THIS to the website you want the gift to open
  const REDIRECT_URL = "https://example.com";

  const show = id => {
    document.querySelectorAll(".scene").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  };

  function confetti() {
    const items = ["🎉", "✨", "💗", "🎊", "⭐"];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.textContent = items[Math.floor(Math.random() * items.length)];
      c.style.left = Math.random() * 100 + "vw";
      c.style.animationDuration = 2 + Math.random() * 2.5 + "s";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }
  }

  // 1. cat -> hands
  const photo = document.getElementById("catPhoto");
  const svgCat = document.getElementById("cat");
  // Use cat.jpg if it exists, otherwise fall back to the drawn cat
  photo.addEventListener("load", () => { photo.style.display = "block"; svgCat.style.display = "none"; });
  photo.addEventListener("error", () => { photo.style.display = "none"; });
  [photo, svgCat].forEach(el => el.addEventListener("click", () => show("scene2")));

  // 2. either hand -> gift box
  document.querySelectorAll(".hand").forEach(btn => {
    btn.addEventListener("click", () => {
      btn.classList.add("shake");
      setTimeout(() => { show("scene3"); confetti(); }, 450);
    });
  });

  // 3. gift -> redirect
  document.getElementById("giftBtn").addEventListener("click", () => {
    confetti();
    setTimeout(() => { window.location.href = REDIRECT_URL; }, 600);
  });
</script>
</body>
</html>
